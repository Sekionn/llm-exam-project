spring.application.name=llm_project
spring.config.import=optional:file:./.env[.properties]

server.port=${SERVER_PORT:8090}

app.ai.strip-markdown=${AI_STRIP_MARKDOWN:true}
app.ai.rag-enabled=${AI_RAG_ENABLED:true}
app.ai.rag-top-k=${AI_RAG_TOP_K:3}
spring.ai.ollama.base-url=${AI_OLLAMA_BASE_URL:http://localhost:11434}
# Local models only: the exam requires a local LLM (the old default was the cloud model glm-4.6:cloud)
spring.ai.ollama.chat.options.model=${AI_OLLAMA_CHAT_MODEL:qwen3:4b}
spring.ai.ollama.embedding.options.model=${AI_OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
spring.ai.ollama.chat.options.temperature=${AI_OLLAMA_TEMPERATURE:0.3}
